name: Precompute Trails

# Routes each of-interest vessel's land-crossing trail gaps with A* (too heavy for
# a CPU-capped CF Worker) and stores the sparse inferred waypoints in D1, which the
# Worker serves unioned with live positions. Primary trigger is the Worker firing
# workflow_dispatch right after the hourly global scan (when new gaps appear); the
# schedule is a fallback. Converges — vessels with no new crossing are skipped.
on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Rebuild ALL stored waypoints, ignoring the freshness heuristic"
        type: boolean
        default: false
      limit:
        description: "Max vessels to examine this run (blank = no limit)"
        type: string
        default: ""
      offset:
        description: "Skip this many vessels first — batches a regenerate across runs (blank = 0)"
        type: string
        default: ""
      mmsi:
        description: "Rebuild ONE vessel only (blank = all). Pair with regenerate to clear a bad stored trail."
        type: string
        default: ""
      budget:
        description: "Max D1 rows written this run (default 50000). The script also stops when today's shared ingest+precompute ledger hits the safety ceiling (90000). A budget stop is a controlled exit — resume with another dispatch; already-upgraded vessels are skipped."
        type: string
        default: ""
  # DAILY safety net only — the Worker's dispatch is the real trigger.
  # This was every 6h, mirroring the Worker's own 6-hourly dispatch, on the theory that
  # the two would interleave ~50 min apart. They do not: GitHub runs scheduled workflows
  # best-effort and this one fired 4h23m late (06:00 -> 10:23) and 3h37m late
  # (12:00 -> 15:37) on 2026-09-04, while the Worker's dispatch hit 12:59:07 exactly.
  # So the cron cannot be reasoned about relative to the dispatch — it just doubled the
  # run count at random offsets, and every extra run was another full pass. Demoted to
  # once a day: it still covers a Worker outage / missing GITHUB_DISPATCH_TOKEN, which is
  # all a fallback owes us. Drift of a few hours is irrelevant at daily cadence.
  schedule:
    - cron: "0 3 * * *"

# Don't pile up overlapping runs; let an in-flight run finish.
concurrency:
  group: precompute-trails
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Saturation was caused by the HOURLY dispatch (a 160-min average run, max 230, so the
    # group was busy ~100% of the time and 35 of every 60 runs were cancelled while queued),
    # NOT by run length. The dispatch is now 6-hourly (PRECOMPUTE_DISPATCH_EVERY_HOURS), which
    # a 230-min run fits inside comfortably. So this is a SAFETY NET, not a budget: 300 min
    # stays under the 6 h interval so a pathological run can never overlap the next dispatch.
    # The repo is PUBLIC, so Actions minutes are free — a long run costs staleness, not money.
    # Do NOT tighten this to force short runs: a 75-min cap was measured processing only
    # 25 of 80 candidates against ~96 becoming eligible every 6 h, i.e. permanently falling
    # behind, and every run ended as `cancelled` at exactly the cap.
    timeout-minutes: 300

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Precompute trail waypoints
        # --max-old-space-size: routeWater's A* grid is now fine-celled (0.2 km floor) and
        # bounded by a cell-count budget; a worst-case long gap allocates dense rows*cols
        # typed arrays up to ~270 MB. Pin the heap so the budget is guaranteed, not reliant
        # on Node's RAM auto-sizing.
        # The freshness heuristic is VERSION-AWARE (any vessel with stored segments older
        # than GENERATOR_VERSION stays eligible), so a router/version bump self-heals on
        # the normal dispatch cadence — no regenerate=true needed for fleet rebuilds.
        # regenerate=true only forces an unconditional rebuild (e.g. --mmsi to clear one
        # bad trail). Its work is SELF-LIMITING: the script reads today's shared
        # ingest+precompute D1 write ledger (scan_meta) and stops at its own
        # --write-budget (default 50000 rows, leaving room for ingestion under the 100k
        # daily cap) or the 90000 shared ceiling — so it can never trip the write limit,
        # and positions are READ lazily so a budget stop never wastes the read budget.
        # A budget stop exits 0 with a WRITE BUDGET STOP log; the next dispatch resumes
        # where the last left off (vessels whose stored segments already carry this
        # generator_version are converged-skipped, so a rebuild advances day over day
        # instead of redoing the first N). No offset batching required anymore.
        # `limit`/`offset`/`mmsi` still work for fine control.
        run: |
          node --max-old-space-size=4096 scripts/precompute-trails.mjs \
            ${{ inputs.regenerate && '--regenerate' || '' }} \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.offset != '' && format('--offset {0}', inputs.offset) || '' }} \
            ${{ inputs.mmsi != '' && format('--mmsi {0}', inputs.mmsi) || '' }} \
            ${{ inputs.budget != '' && format('--write-budget {0}', inputs.budget) || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
