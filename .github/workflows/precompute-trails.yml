name: Precompute Trails

# Routes each of-interest vessel's land-crossing trail gaps with A* (too heavy for
# a CPU-capped CF Worker) and stores the sparse inferred waypoints in D1, which the
# Worker serves unioned with live positions. Primary trigger is the Worker firing
# workflow_dispatch right after the hourly global scan (when new gaps appear); the
# schedule is a fallback. Converges — vessels with no new crossing are skipped.
on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Rebuild ALL stored waypoints, ignoring the freshness heuristic"
        type: boolean
        default: false
      limit:
        description: "Max vessels to examine this run (blank = no limit)"
        type: string
        default: ""
      offset:
        description: "Skip this many vessels first — batches a regenerate across runs (blank = 0)"
        type: string
        default: ""
      mmsi:
        description: "Rebuild ONE vessel only (blank = all). Pair with regenerate to clear a bad stored trail."
        type: string
        default: ""
  # Fallback only, every 6h. It used to be hourly, which collided with the
  # Worker's own hourly dispatch: GitHub keeps a single pending run per
  # concurrency group, so the second trigger of each hour was cancelled while
  # queued (~22% of all runs showed as `cancelled` — noise, not failures).
  schedule:
    - cron: "0 */6 * * *"

# Don't pile up overlapping runs; let an in-flight run finish.
concurrency:
  group: precompute-trails
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Saturation was caused by the HOURLY dispatch (a 160-min average run, max 230, so the
    # group was busy ~100% of the time and 35 of every 60 runs were cancelled while queued),
    # NOT by run length. The dispatch is now 6-hourly (PRECOMPUTE_DISPATCH_EVERY_HOURS), which
    # a 230-min run fits inside comfortably. So this is a SAFETY NET, not a budget: 300 min
    # stays under the 6 h interval so a pathological run can never overlap the next dispatch.
    # The repo is PUBLIC, so Actions minutes are free — a long run costs staleness, not money.
    # Do NOT tighten this to force short runs: a 75-min cap was measured processing only
    # 25 of 80 candidates against ~96 becoming eligible every 6 h, i.e. permanently falling
    # behind, and every run ended as `cancelled` at exactly the cap.
    timeout-minutes: 300

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Precompute trail waypoints
        # --max-old-space-size: routeWater's A* grid is now fine-celled (0.2 km floor) and
        # bounded by a cell-count budget; a worst-case long gap allocates dense rows*cols
        # typed arrays up to ~270 MB. Pin the heap so the budget is guaranteed, not reliant
        # on Node's RAM auto-sizing.
        # The freshness heuristic skips any vessel whose last_pos_ts hasn't advanced, so
        # a ROUTER change alone never rebuilds existing waypoints — they stay as the old
        # generator left them. After changing the router, dispatch with regenerate=true.
        # No default --limit: the freshness heuristic already bounds the work (measured
        # 96 eligible of 937 examined-worthy vessels, 841 skipped), and a limit caps
        # throughput BELOW the rate vessels become eligible. Pass `limit` explicitly only
        # to batch a regenerate, which bypasses the heuristic.
        # To batch it under the 6h job cap, `limit` is NOT enough on its own: regenerate
        # bypasses the heuristic, so every batch would re-do the same first N vessels.
        # Pair it with `offset` (0, then N, then 2N, …) to walk the list.
        run: |
          node --max-old-space-size=4096 scripts/precompute-trails.mjs \
            ${{ inputs.regenerate && '--regenerate' || '' }} \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.offset != '' && format('--offset {0}', inputs.offset) || '' }} \
            ${{ inputs.mmsi != '' && format('--mmsi {0}', inputs.mmsi) || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
